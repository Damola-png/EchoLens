<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="EchoLens architecture diagram">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071823" />
      <stop offset="100%" stop-color="#102c3a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg2)" />
  <text x="60" y="84" fill="#e9f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">EchoLens AI Pipeline Architecture</text>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d9f3ff" text-anchor="middle">
    <rect x="60" y="180" width="180" height="94" rx="14" fill="#134055" stroke="#2f7086" />
    <text x="150" y="236">Image Upload</text>

    <rect x="290" y="180" width="190" height="94" rx="14" fill="#134055" stroke="#2f7086" />
    <text x="385" y="236">Face Detection</text>

    <rect x="530" y="180" width="190" height="94" rx="14" fill="#134055" stroke="#2f7086" />
